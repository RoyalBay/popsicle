<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popsicle Propaganda — HQ</title>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ===== YOUR ORIGINAL CSS (UNCHANGED FOR BREVITY) ===== */
:root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#ff3c5f;--yellow:#ffe135;--cyan:#00e5ff;--green:#39ff14;--text:#f0f0f0;--muted:#666;--font-display:'Bebas Neue',sans-serif;--font-mono:'DM Mono',monospace;--font-body:'DM Sans',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)}
/* (keep rest of your CSS exactly as-is) */
</style>
</head>

<body>

<header>
  <div class="logo" id="logo"></div>
</header>

<div id="tax-toggle-container"></div>

<div id="config-banner">Loading...</div>

<main>
  <div id="product-grid"></div>
</main>

<div id="sale-modal"></div>
<div id="toast"></div>

<script>
/* =========================
   SAFE CONFIG BOOTSTRAP
========================= */
const CONFIG = window.POS_CONFIG || {
  taxes: [
    { id: "gst", label: "GST", rate: 0.05, enabled: false },
    { id: "pst", label: "PST", rate: 0.07, enabled: false },
    { id: "mst", label: "MST", rate: 0.0, enabled: false }
  ],
  features: { loyalty: true }
};

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL = 'https://plrhgzsjbvpygjjysxot.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_KEY';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   TAX SYSTEM FIXED
========================= */
const TAXES = {};

(CONFIG.taxes || []).forEach(t => {
  TAXES[t.id] = { rate: t.rate, on: t.enabled };
});

function getTotalTaxRate() {
  return Object.values(TAXES).reduce((s,t)=>s+(t.on?t.rate:0),0);
}

function toggleTax(id) {
  TAXES[id].on = !TAXES[id].on;
  renderTaxToggles();
}

/* =========================
   REQUIRED MISSING FUNCTIONS
========================= */
function applyBranding() {
  document.getElementById("logo").innerHTML = "POPSICLE<span style='color:var(--accent)'>POS</span>";
}

function renderTaxToggles() {
  const el = document.getElementById("tax-toggle-container");
  if (!el) return;

  el.innerHTML = Object.entries(TAXES).map(([id,t]) => `
    <div onclick="toggleTax('${id}')"
         style="cursor:pointer;display:inline-block;margin:5px;padding:6px 10px;border:1px solid #333;">
      ${id.toUpperCase()} : ${t.on ? "ON" : "OFF"}
    </div>
  `).join('');
}

/* =========================
   PRODUCTS (SAFE VERSION)
========================= */
let products = {};

async function loadProducts() {
  try {
    const { data, error } = await db.from('products').select('*').eq('active', true);
    if (error) throw error;

    products = {};
    (data || []).forEach(p => products[p.id] = p);

    renderProducts(data || []);
  } catch (e) {
    document.getElementById("product-grid").innerHTML =
      "<p style='color:red'>Failed to load products</p>";
  }
}

function renderProducts(list) {
  const el = document.getElementById("product-grid");
  const tax = getTotalTaxRate();

  el.innerHTML = list.map(p => `
    <div style="border:1px solid #333;padding:10px;margin:10px;">
      <div>${p.id}</div>
      <div>${p.name}</div>
      <div>$${p.price}</div>
      <div>After tax: $${(p.price*(1+tax)).toFixed(2)}</div>
    </div>
  `).join('');
}

/* =========================
   TOAST
========================= */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>t.style.display="none",3000);
}

/* =========================
   INIT (FIXED — SINGLE BLOCK)
========================= */
document.addEventListener("DOMContentLoaded", () => {
  applyBranding();
  renderTaxToggles();

  if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL") {
    document.getElementById("config-banner").style.display = "none";
    loadProducts();
  } else {
    document.getElementById("config-banner").innerText =
      "⚠ Set Supabase credentials first";
  }
});
</script>

</body>
</html>
